spring.application.name=backend
spring.config.import=optional:file:.env

server.port=${PORT:9090}

# ===============================
# DATABASE CONFIG
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# HIKARI CONNECTION POOL (CRITICAL)
# ===============================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000

# ===============================
# JPA / HIBERNATE (PRODUCTION SAFE)
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# LOGGING (REDUCED)
# ===============================
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# ===============================
# GOOGLE OAUTH
# ===============================
google.client-id=${GOOGLE_CLIENT_ID}

# ===============================
# EMAIL CONFIG
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ===============================
# CASHFREE
# ===============================
cashfree.client-id=${CASHFREE_CLIENT_ID}
cashfree.client-secret=${CASHFREE_CLIENT_SECRET}
cashfree.api-version=${CASHFREE_API_VERSION}
cashfree.base-url=${CASHFREE_BASE_URL}
cashfree.return-url=https://your-frontend-domain.com/event-success
